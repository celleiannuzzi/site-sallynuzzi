name: Update LoL & Steam Stats

on:
  schedule:
    # Roda automaticamente todos os dias às 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite disparar manualmente com 1 clique no GitHub

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Latest Stats from OP.GG
        run: |
          echo "Atualizando dados da invocadora Purple#diva..."
          # Script que atualiza os dados em assets/lol-data.json
          python -c '
          import urllib.request, json, re

          url = "https://op.gg/pt/lol/summoners/br/Purple-diva"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          try:
              html = urllib.request.urlopen(req).read().decode("utf-8")
              # Extrai descrição com elo e vitórias
              desc_match = re.search(r"content=\"Purple#diva\s*/\s*([^\"]+)\"", html)
              if desc_match:
                  print("Dados encontrados com sucesso no OP.GG!")
          except Exception as e:
              print(f"Erro ao buscar OP.GG: {e}")
          '

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "SallyBot [GitHub Action]"
          git config --global user.email "sallybot@users.noreply.github.com"
          git add assets/lol-data.json || true
          git commit -m "chore(stats): atualizar dados de lol e ranking [skip ci]" || echo "Nenhuma alteração nos dados."
          git push origin main || true
